<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}"><title>{{TITLE}} · CoolCode</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.mjs"></script></head>
<body data-tool-id="{{TOOL_ID}}"><a class="skip" href="#main">Skip to content</a><header><a href="https://coolcode.ca/">CoolCode.ca</a><a href="{{SOURCE_URL}}#readme">Tool guide ↗</a></header>
